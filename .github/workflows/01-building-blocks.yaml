name: 01 - Building Blocks

# what triggers the workflow - In this case on push
on: push

jobs:
    echo-hello:
        runs-on: ubuntu-latest
        steps:
            - name: Say hello
              run: echo "Hello, world!"
    
    echo-goodbye:
        runs-on: ubuntu-latest
        steps:
            - name: Failed step
              run: | # this "|" states start in a new line, it indicates multi line
                echo "I will succeed"
                exit 0
            - name: Say goodbye
              run: echo "Goodbye!"